<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PURE DIVE Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --text:#0f1923;
  --muted:#6b7a8d;
  --hint:#a8b4c0;
  --border:#e4e9ee;
  --bg:#f7f9fb;
  --white:#ffffff;
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}

/* ── 全頁底圖 ── */
body::before{
  content:'';
  position:fixed;
  inset:0;
  /* 把這裡的 YOUR_BASE64_HERE 換成你的圖片 base64 字串 */
  /* 格式：url('data:image/png;base64,YOUR_BASE64_HERE') */
  background-image: url('bg.png');
  background-color: #1a2a3a;
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
  z-index: 0;
}

/* ── 暗層 ── */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.52);
  z-index:1;
}

header, .hero, .tabs, footer{
  position:relative;
  z-index:2;
}

header{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.15);
  padding:0 24px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo-text{
  font-size:15px;
  font-weight:600;
  color:#fff;
  letter-spacing:-.01em;
}
.header-tag{
  font-family:'DM Mono',monospace;
  font-size:10px;
  color:rgba(255,255,255,0.45);
  letter-spacing:.07em;
}

.hero{
  padding:36px 24px 28px;
  max-width:480px;
  margin:0 auto;
}
.hero-title{
  font-size:24px;
  font-weight:600;
  color:#fff;
  letter-spacing:-.02em;
  margin-bottom:6px;
}
.hero-desc{
  font-size:14px;
  color:rgba(255,255,255,0.6);
  line-height:1.6;
}

.tabs{
  max-width:480px;
  margin:0 auto;
  padding:0 16px 40px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.tab{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 24px;
  border-radius:12px;
  text-decoration:none;
  cursor:pointer;
  transition:transform .12s, filter .12s;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.tab:active{
  transform:scale(0.983);
  filter:brightness(.94);
}

.tab-left{}
.tab-en{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:.08em;
  opacity:.65;
  margin-bottom:5px;
}
.tab-name{
  font-size:22px;
  font-weight:600;
  letter-spacing:-.01em;
}
.tab-arrow{
  font-size:22px;
  opacity:.5;
}

.tab-a{background:#0096E6;color:#fff;}
.tab-b{background:#F5A623;color:#3D2800;}
.tab-d{background:#10B981;color:#fff;} /* 新增的綠色樣式 */
.tab-e{background:#7C3AED;color:#fff;}
.tab-c{background:#e8ecf0;color:#9ca3af;cursor:default;}
.tab-c:active{transform:none;filter:none;}
.tab-c .tab-en{opacity:.5;}
.tab-c .tab-arrow{opacity:.25;}
.coming{
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.06em;
  background:rgba(0,0,0,.06);
  padding:3px 8px;
  border-radius:100px;
  color:#9ca3af;
}

footer{
  text-align:center;
  padding:8px 20px 32px;
  font-size:11px;
  color:rgba(255,255,255,0.3);
  font-family:'DM Mono',monospace;
}
</style>
</head>
<body>

<header>
  <div class="logo-text">PURE DIVE Staff</div>
  <div class="header-tag">INTERNAL</div>
</header>

<div class="hero">
  <div class="hero-title">點一點就弄好了</div>
  <div class="hero-desc"></div>
</div>

<div class="tabs">

  <a class="tab tab-a" href="/keelung/">
    <div class="tab-left">
      <div class="tab-en">KEELUNG</div>
      <div class="tab-name">基隆 計算機</div>
    </div>
    <div class="tab-arrow">→</div>
  </a>

  <a class="tab tab-b" href="/kenting/">
    <div class="tab-left">
      <div class="tab-en">KENTING</div>
      <div class="tab-name">墾丁 計算機</div>
    </div>
    <div class="tab-arrow">→</div>
  </a>

  <!-- 新增的第三格：潛水投保 -->
  <a class="tab tab-d" href="https://puredive-insurance.vercel.app/" target="_blank" rel="noopener noreferrer">
    <div class="tab-left">
      <div class="tab-en">INSURANCE</div>
      <div class="tab-name">潛水投保</div>
    </div>
    <div class="tab-arrow">→</div>
  </a>

  <!-- 順延至第四格 -->
  <a class="tab tab-e" href="https://sdi-ow-exam-entry.vercel.app/" target="_blank" rel="noopener noreferrer">
    <div class="tab-left">
      <div class="tab-en">EXAM</div>
      <div class="tab-name">SDI 學科測試</div>
    </div>
    <div class="tab-arrow">→</div>
  </a>

  <!-- 順延至第五格 -->
  <div class="tab tab-c">
    <div class="tab-left">
      <div class="tab-en">FINANCE</div>
      <div class="tab-name">墾丁 收支總表</div>
    </div>
    <div class="coming">即將推出</div>
  </div>

</div>

<footer>PURE DIVE © 2025 · Staff Internal Use Only</footer>

</body>
</html>
