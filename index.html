/* ── 暗層 ── */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.52);
  z-index:1;
}

header, .hero, .tabs, footer{
  position:relative;
  z-index:2;
}

header{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.15);
  padding:0 24px;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo-text{
  font-size:30px;
  font-weight:600;
  color:#fff;
  letter-spacing:-.01em;
}
.header-tag{
  font-family:'DM Mono',monospace;
  font-size:10px;
  color:rgba(255,255,255,0.45);
  letter-spacing:.07em;
}

.hero{
  padding:12px 24px 8px;
  max-width:210px;
  margin:0 0 0 auto;
  text-align:center;
  width:100%;
}
.hero-title{
  font-size:24px;
  font-weight:600;
  color:#fff;
  letter-spacing:-.02em;
  margin-bottom:6px;
}
.hero-desc{
  font-size:14px;
  color:rgba(255,255,255,0.6);
  line-height:1.6;
}

.tabs{
  max-width:210px;
  margin:0 0 0 auto;
  padding:0 16px 40px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.tab{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 19px;
  border-radius:12px;
  text-decoration:none;
  cursor:pointer;
  transition:transform .12s, filter .12s;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.tab:active{
  transform:scale(0.983);
  filter:brightness(.94);
}

.tab-left{}
.tab-en{
  font-family:'DM Mono',monospace;
  font-size:13px;
  letter-spacing:.08em;
  opacity:.65;
  margin-bottom:5px;
}
.tab-name{
  font-size:19px;
  font-weight:600;
  letter-spacing:-.01em;
}
.tab-arrow{
  font-size:26px;
  opacity:.5;
}

.tab-a{background:rgba(0,150,230,0.28);color:#fff;border:0.5px solid rgba(255,255,255,0.25);}
.tab-b{background:rgba(245,166,35,0.28);color:#fff;border:0.5px solid rgba(255,255,255,0.25);}
.tab-d{background:rgba(16,185,129,0.28);color:#fff;border:0.5px solid rgba(255,255,255,0.25);}
.tab-e{background:rgba(124,58,237,0.28);color:#fff;border:0.5px solid rgba(255,255,255,0.25);}
.tab-c{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.35);cursor:default;border:0.5px solid rgba(255,255,255,0.12);}
.tab-c:active{transform:none;filter:none;}
.tab-c .tab-en{opacity:.5;}
.tab-c .tab-arrow{opacity:.25;}
.coming{
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.06em;
  background:rgba(255,255,255,0.1);
  padding:3px 8px;
  border-radius:100px;
  color:rgba(255,255,255,0.3);
}

footer{
  text-align:center;
  padding:8px 20px 32px;
  font-size:11px;
  color:rgba(255,255,255,0.3);
  font-family:'DM Mono',monospace;
}

@media(max-width:600px){
  .hero{max-width:175px;margin:0 0 0 auto;padding:20px 12px 14px;}
  .tabs{max-width:175px;margin:0 0 0 auto;padding:0 10px 32px;}
  .tab{padding:12px 14px;border-radius:10px;}
  .tab-name{font-size:16px;}
  .tab-en{font-size:11px;margin-bottom:3px;}
  .tab-arrow{font-size:16px;}
  .tabs{gap:8px;}
  .hero-title{font-size:19px;}
  .hero-desc{font-size:13px;}
}

@media(min-width:601px){
  .hero{
    width:510px;
    max-width:510px;
    margin:0;
    text-align:center;
  }
  .tabs{
    width:510px;
    max-width:510px;
    margin:0;
    padding:0 16px 40px;
  }
}
.main-wrap{
  min-height:calc(100vh - 72px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
@media(min-width:601px){
  .main-wrap{
    align-items:flex-end;
    padding-right:8%;
  }
}
</style>
